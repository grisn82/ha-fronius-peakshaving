# Fronius Gen24 peak shaving for Home Assistant
# Code generated by an AI assistant (Claude, Anthropic); tested by the maintainer. See README.
# Von einem KI-Assistenten (Claude) erstellt; vom Maintainer getestet. Siehe README.
# ============================================================
# Fronius Gen24 - limit grid import per quarter-hour (e.g. 500 Wh)
# Home Assistant package for the ha-sunspec2 integration
# ENERGY-BASED: energy counters instead of instantaneous power samples
# ============================================================
# Idea
#  The goal is an amount of energy (Wh per 15 minutes), not a power. Therefore:
#  1) Grid import so far in the current quarter-hour comes straight from the import
#     counter (utility_meter). Every spike is counted exactly, even a few seconds long.
#  2) The power still allowed for the rest of the quarter-hour is computed from energy:
#        P_strict = (limit - reserve - imported so far) / remaining time
#  3) The current demand (house consumption minus PV) is NOT built from instantaneous
#     power values but from the energy counters of the last ca. 60 s:
#        demand = (d import + d battery discharged - d battery charged) / d time
#     (Statistics sensors with "change_second"). Counters integrate everything that
#     happened between two polls, so no spike gets lost.
#  3b) RELAXED AT THE START, STRICT AT THE END: "remaining energy / remaining time"
#     assumes the current demand lasts for the whole rest of the interval. At the start
#     of a quarter-hour that is unlikely, the regulator then acts too early and part of
#     the budget stays unused. So the remaining time of the forecast is multiplied by a
#     weight w that rises linearly from w0 (helper fronius_anfang_gewicht, e.g. 0.6) at
#     the start to 1.0 at the end:
#        P_allowed = remaining energy / (remaining time * w)
#     Safeguard: if the battery would only barely be able to catch up under the strict
#     rule (needed discharge power >= guard_anteil * max battery power), the strict rule
#     (w = 1) applies immediately. Grid charging always uses the strict rule.
#  4) demand > P_allowed -> battery mode "discharge_limit" with a discharge limit in watts.
#     The state is only left once the demand is clearly below P_allowed
#     (hysteresis in watts instead of a waiting time).
#  5) Room in the budget + grid charging allowed -> "charge_from_grid"
#     (start/target SoC hysteresis), with a safety margin to the budget.
#  6) Otherwise idle, depending on the idle mode (input_select.fronius_leerlauf_modus):
#       sperren          -> "block_discharging" (battery only for peaks)
#       auto             -> "auto" (normal self-consumption)
#       auto_mit_reserve -> "auto" while the SoC is above the reserve; when the SoC falls to
#                           the reserve, discharging is blocked. Back to "auto" only at
#                           reserve + 3 percentage points.
#       auto_nach_budget -> "block_discharging" until the budget (limit - reserve) of the
#                           quarter-hour is used up, then "auto" (the inverter regulates the
#                           grid import to 0 by itself) until the next quarter-hour. The battery
#                           only supplies what exceeds the budget. No discharge limit in watts
#                           is used in this mode. "auto" only while SoC > minimum SoC.
#  Missing/invalid sensor value -> state "fehler" -> mode "auto" (fail-safe).
#
# ------------------------------------------------------------
# ADJUST TO YOUR SYSTEM  (search & replace each ID in this file)
# ------------------------------------------------------------
# The entity IDs below are the ones of the author's system. Replace them with yours.
# Each ID appears in several places, use search & replace.
#   select.symo_gen24_8_0_storage_batterie_betriebsart           battery mode (select)
#   number.symo_gen24_8_0_storage_batterie_entladelimit          discharge limit, W
#   number.symo_gen24_8_0_storage_batterie_netzladeleistung      grid charge power, W
#   number.symo_gen24_8_0_storage_batterie_ladeleistung_max      max battery power (WChaMax), W
#   sensor.sunspecfronius_storage_chastate                       battery state of charge, %
#   sensor.sunspecfronius_sm_meter_three_phase_wye_total_watt_hours_imported   grid import counter, Wh
#   sensor.sunspecfronius_mppt_module_2_dc_power                 battery CHARGE power, W (positive while charging)
#   sensor.sunspecfronius_mppt_module_3_dc_power                 battery DISCHARGE power, W (positive while discharging)
#
# The two battery power sensors are the DC power of two channels. On the author's system
# module 2 = charging and module 3 = discharging. THIS CAN DIFFER ON YOUR SYSTEM.
# Swapped sensors flip the sign of the battery share and break the whole regulation.
# The battery energy is NOT taken from the lifetime energy counters of the inverter: they
# only update every ca. 5 minutes and produce false demand spikes. Instead the power is
# integrated to Wh here (Integration sensors, updated every 10 s).
# Check before enabling: sensor.fronius_bedarf_energie must match the real house demand
# (consumption minus PV), with the battery idle as well as charging/discharging.
# Grid import counter in kWh instead of Wh? Then replace the factor 3600 in the demand
# sensor below by 3600000 for the import term (see comment there). The battery power
# sensors must be in W.
#
# Do NOT rename the Statistics sensors and the template sensor ("Fronius Stat ...",
# "Fronius Bedarf Energie"): their entity IDs are derived from the names and are
# referenced by the automation. The names of the helpers can be changed freely
# (their entity IDs come from the keys).
#
# REQUIREMENTS
#  - Inverter: Modbus TCP on, "allow control" on.
#  - Grid charging: switch "battery charging from grid allowed" in HA AND the inverter's own
#    permission to charge the battery from the grid.
#  - Inverter charge schedules off, and the "Battery plan" entity of ha-sunspec2 off.
#  - Set "Battery rate revert time" (fallback to automatic mode if HA stops sending).
#    This automation re-sends the mode every 10 s.
#  - Home Assistant 2024.10 or newer (uses the "triggers:"/"trigger:" syntax).
# ============================================================

# ---------- Helper entities ----------
input_boolean:
  fronius_peakshaving:
    name: "Fronius: Bezugsbegrenzung aktiv"
    icon: mdi:flash-triangle
  fronius_netzladen_erlaubt:
    name: "Fronius: Netzladen im freien Budget erlaubt"
    icon: mdi:battery-charging
  fronius_ladephase:
    name: "Fronius: Ladephase aktiv (Hysterese, wird von der Automation gesetzt)"
    icon: mdi:battery-sync

input_select:
  fronius_leerlauf_modus:
    name: "Fronius: Leerlaufmodus"
    options:
      - sperren   # battery only discharges when the limit requires it
      - auto      # battery works normally (self-consumption)
      - auto_mit_reserve   # self-consumption, but the reserve (SoC) is kept for peaks
      - auto_nach_budget   # battery blocked until the 15 min budget is used up, then auto
  # Status display: written by the automation only
  fronius_zustand:
    name: "Fronius: Regelzustand"
    icon: mdi:state-machine
    options:
      - auto
      - sperren
      - entladen
      - laden
      - fehler
      - aus

input_number:
  fronius_bezug_limit_wh:
    name: "Fronius: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_bezug_reserve_wh:
    name: "Fronius: Sicherheitsreserve"
    min: 0
    max: 300
    step: 10
    unit_of_measurement: Wh
  fronius_min_soc:
    name: "Fronius: Mindest-SoC für Entladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_anfang_gewicht:
    name: "Fronius: Prognosegewicht am Viertelstundenanfang (1 = streng)"
    min: 0.2
    max: 1
    step: 0.05
  fronius_reserve_soc:
    name: "Fronius: Reserve-SoC für Spitzen (Leerlauf auto_mit_reserve)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc:
    name: "Fronius: Netzladen startet unter SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_ziel_soc:
    name: "Fronius: Netzladen endet bei SoC (Ziel)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

# Grid import so far in the current quarter-hour (resets itself at :00/:15/:30/:45)
utility_meter:
  fronius_bezug_viertelstunde:
    source: sensor.sunspecfronius_sm_meter_three_phase_wye_total_watt_hours_imported   # import counter in Wh
    cycle: quarter-hourly

# ---------- Mean power from the energy counters ----------
# "change_second" = (newest - oldest counter value) / seconds in between, unit Wh/s.
# 60 s window: with a poll every ca. 30 s that is about 2-3 counter values.
# Shorter = faster but less accurate; longer (90-120 s) = calmer but slower.
# keep_last_sample: the last value is kept even if nothing was imported for a while.
sensor:
  # Battery energy by integrating the DC power (Wh). max_sub_interval makes the sensor
  # update every 10 s even when the power stays constant.
  - platform: integration
    name: "Fronius Batterie Ladeenergie"
    unique_id: fronius_batterie_ladeenergie
    source: sensor.sunspecfronius_mppt_module_2_dc_power   # battery CHARGE power in W
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      seconds: 10
  - platform: integration
    name: "Fronius Batterie Entladeenergie"
    unique_id: fronius_batterie_entladeenergie
    source: sensor.sunspecfronius_mppt_module_3_dc_power   # battery DISCHARGE power in W
    unit_time: h
    method: trapezoidal
    round: 3
    max_sub_interval:
      seconds: 10
  - platform: statistics
    name: "Fronius Stat Bezug"
    unique_id: fronius_stat_bezug
    entity_id: sensor.sunspecfronius_sm_meter_three_phase_wye_total_watt_hours_imported
    state_characteristic: change_second
    max_age:
      seconds: 60
    keep_last_sample: true
    precision: 5
  - platform: statistics
    name: "Fronius Stat Entladen"
    unique_id: fronius_stat_entladen
    entity_id: sensor.fronius_batterie_entladeenergie
    state_characteristic: change_second
    max_age:
      seconds: 60
    keep_last_sample: true
    precision: 5
  - platform: statistics
    name: "Fronius Stat Laden"
    unique_id: fronius_stat_laden
    entity_id: sensor.fronius_batterie_ladeenergie
    state_characteristic: change_second
    max_age:
      seconds: 60
    keep_last_sample: true
    precision: 5

# Demand without battery (house consumption minus PV) in W, from the energy mean of the
# last ca. 60 s (grid import counter + integrated battery power). To check: compare the value with the real house power.
# Wh/s -> W: times 3600. (Counters in kWh: use 3600000 instead of 3600 for this term.)
template:
  - sensor:
      - name: "Fronius Bedarf Energie"
        unique_id: fronius_bedarf_energie
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ states('sensor.fronius_stat_bezug') != 'unavailable'
             and states('sensor.fronius_stat_entladen') != 'unavailable'
             and states('sensor.fronius_stat_laden') != 'unavailable' }}
        state: >-
          {{ ((states('sensor.fronius_stat_bezug') | float(0)
               + states('sensor.fronius_stat_entladen') | float(0)
               - states('sensor.fronius_stat_laden') | float(0)) * 3600) | round(0) }}

# ---------- Automations ----------
automation:
  - id: fronius_bezugsgrenze_regelung
    alias: "Fronius: Netzbezug pro 15 min begrenzen"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.fronius_peakshaving
        state: "on"
    actions:
      - variables:
          # ---- Entities (ADJUST) ----
          ent_mode: select.symo_gen24_8_0_storage_batterie_betriebsart
          ent_soc: sensor.sunspecfronius_storage_chastate
          ent_discharge_limit: number.symo_gen24_8_0_storage_batterie_entladelimit
          ent_grid_charge_power: number.symo_gen24_8_0_storage_batterie_netzladeleistung
          ent_wchamax: number.symo_gen24_8_0_storage_batterie_ladeleistung_max
          # Counters (only used for the validity check; the means come from the Statistics sensors above)
          ent_cnt_import: sensor.sunspecfronius_sm_meter_three_phase_wye_total_watt_hours_imported
          ent_cnt_charge: sensor.fronius_batterie_ladeenergie
          ent_cnt_discharge: sensor.fronius_batterie_entladeenergie
          # ---- Fine tuning ----
          laden_marge_w: 300    # safety margin to the budget when charging from the grid, W
          laden_min_w: 300      # minimum charge power to start grid charging, W
          entlade_hyst_w: 200   # discharging only ends when the demand is this far below the allowed value, W
          guard_anteil: 0.6     # strict rule once the needed discharge power reaches this share of the max battery power
      - variables:
          ok: >-
            {{ has_value('sensor.fronius_bezug_viertelstunde')
               and has_value(ent_cnt_import)
               and has_value(ent_cnt_charge)
               and has_value(ent_cnt_discharge)
               and has_value('sensor.fronius_bedarf_energie')
               and has_value(ent_soc)
               and has_value(ent_wchamax) }}
          limit_wh: "{{ states('input_number.fronius_bezug_limit_wh') | float(500) }}"
          reserve_wh: "{{ states('input_number.fronius_bezug_reserve_wh') | float(50) }}"
          min_soc: "{{ states('input_number.fronius_min_soc') | float(15) }}"
          ziel_soc: "{{ states('input_number.fronius_ziel_soc') | float(25) }}"
          start_soc: "{{ states('input_number.fronius_start_soc') | float(20) }}"
          wchamax: "{{ states(ent_wchamax) | float(0) }}"
          soc: "{{ states(ent_soc) | float(0) }}"
          used_wh: "{{ states('sensor.fronius_bezug_viertelstunde') | float(0) }}"
          # Remaining time of the quarter-hour, bounded below (conservative at the end)
          t_rem: "{{ 900 - ((now().minute % 15) * 60 + now().second) }}"
          t_calc: "{{ [t_rem | float, 60] | max }}"
          # strict allowed power for the rest of the quarter-hour (remaining energy / remaining time)
          p_strict: "{{ [ (limit_wh - reserve_wh - used_wh) * 3600 / t_calc, 0 ] | max }}"
          # Demand without battery, averaged from the energy counters (W)
          p_free: "{{ states('sensor.fronius_bedarf_energie') | float(0) }}"
          # Relaxed at the start, strict at the end: forecast weight w rises linearly from w0 to 1
          x_el: "{{ [[(900 - t_rem) / 900, 0] | max, 1] | min }}"
          w0: "{{ states('input_number.fronius_anfang_gewicht') | float(1) }}"
          w_prog: "{{ w0 + (1 - w0) * x_el }}"
          p_relax: "{{ p_strict / ([w_prog, 0.2] | max) }}"
          guard_w: "{{ guard_anteil * wchamax }}"
          # If the battery would only barely catch up under the strict rule, the strict rule applies at once
          p_allow: "{{ p_relax if (p_free - p_strict) < guard_w else p_strict }}"
          p_dis: "{{ p_free - p_allow }}"
          # Grid charging always uses the strict rule (it consumes budget)
          headroom: "{{ p_strict - p_free }}"
          # Hysteresis: charge phase starts below start_soc and runs until ziel_soc
          ladephase_alt: "{{ is_state('input_boolean.fronius_ladephase', 'on') }}"
          netzladen: >-
            {{ is_state('input_boolean.fronius_netzladen_erlaubt', 'on')
               and (soc < ([start_soc, ziel_soc] | min)
                    or (ladephase_alt and soc < ziel_soc)) }}
          # Idle: sperren | auto | auto_mit_reserve | auto_nach_budget
          leerlauf: "{{ states('input_select.fronius_leerlauf_modus') }}"
          reserve_soc: "{{ states('input_number.fronius_reserve_soc') | float(25) }}"
          reserve_hyst: 3     # percentage points above the reserve from which "auto" applies again
          zustand_alt: "{{ states('input_select.fronius_zustand') }}"
          idle_modus: >-
            {% if leerlauf == 'sperren' %}sperren
            {% elif leerlauf == 'auto_mit_reserve'
                    and (soc <= reserve_soc
                         or (zustand_alt == 'sperren' and soc < reserve_soc + reserve_hyst)) %}sperren
            {% elif leerlauf == 'auto_nach_budget' %}{% if used_wh >= limit_wh - reserve_wh and soc > min_soc %}auto{% else %}sperren{% endif %}
            {% else %}auto{% endif %}
          # Discharging: start when the demand is more than 50 W above the allowed value;
          # end only when it is entlade_hyst_w below (hysteresis, no waiting time)
          entladen_noetig: >-
            {{ leerlauf != 'auto_nach_budget'
               and soc > min_soc
               and p_dis > (-entlade_hyst_w if zustand_alt == 'entladen' else 50) }}
          # Grid charging only with a safety margin to the budget. Once started, it continues
          # as long as at least 100 W of charge power is left (hysteresis).
          laden_ok: >-
            {{ (headroom - laden_marge_w) > (100 if zustand_alt == 'laden' else laden_min_w) }}
          modus: >-
            {% if not ok %}fehler
            {% elif entladen_noetig %}entladen
            {% elif netzladen and laden_ok %}laden
            {% elif idle_modus == 'sperren' %}sperren
            {% else %}auto{% endif %}
      - variables:
          # Powers in watts, rounded to 10 W, 0 .. WChaMax
          discharge_w: >-
            {{ [[(((p_dis + 50) / 10) | round(0)) * 10, 0] | max, wchamax] | min }}
          charge_w: >-
            {{ [[(((headroom - laden_marge_w) / 10) | round(0)) * 10, 0] | max, wchamax] | min }}
      - variables:
          # Discharge with a limit of 0 W = block discharging (never write a 0 W limit)
          mode_option: >-
            {{ {'auto': 'auto', 'fehler': 'auto', 'sperren': 'block_discharging',
                'entladen': ('discharge_limit' if discharge_w >= 10 else 'block_discharging'),
                'laden': 'charge_from_grid'}[modus] }}
      # Set the power first, then the mode (every cycle; this keeps the revert timer alive)
      - choose:
          - conditions: "{{ modus == 'entladen' and discharge_w >= 10 }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ ent_discharge_limit }}"
                data:
                  value: "{{ discharge_w }}"
          - conditions: "{{ modus == 'laden' }}"
            sequence:
              - action: number.set_value
                target:
                  entity_id: "{{ ent_grid_charge_power }}"
                data:
                  value: "{{ charge_w }}"
      - action: select.select_option
        target:
          entity_id: "{{ ent_mode }}"
        data:
          option: "{{ mode_option }}"
      # Track the charge phase (hysteresis) - only with valid measurements
      - if:
          - condition: template
            value_template: "{{ ok and (netzladen | bool(false)) != (ladephase_alt | bool(false)) }}"
        then:
          - action: "{{ 'input_boolean.turn_on' if netzladen | bool(false) else 'input_boolean.turn_off' }}"
            target:
              entity_id: input_boolean.fronius_ladephase
      # Update the status display (only on change)
      - if:
          - condition: template
            value_template: "{{ states('input_select.fronius_zustand') != modus }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.fronius_zustand
            data:
              option: "{{ modus }}"

  # When the limitation is switched off: back to automatic mode
  - id: fronius_bezugsgrenze_aus
    alias: "Fronius: Begrenzung aus -> Automatik"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.fronius_peakshaving
        to: "off"
    actions:
      - action: select.select_option
        target:
          entity_id: select.symo_gen24_8_0_storage_batterie_betriebsart
        data:
          option: auto
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fronius_ladephase
      - action: input_select.select_option
        target:
          entity_id: input_select.fronius_zustand
        data:
          option: aus
