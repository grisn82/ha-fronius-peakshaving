# Values of all months as attributes (data for the chart) and the current month's limit as state
template:
  - sensor:
      - name: "Fronius Saisonprofil"
        unique_id: fronius_saisonprofil
        unit_of_measurement: Wh
        state: >-
          {% set monate = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez'] %}
          {{ states('input_number.fronius_limit_wh_' ~ monate[now().month - 1]) | float(0) }}
        attributes:
          monat: >-
            {% set monate = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez'] %}
            {{ monate[now().month - 1] }}
          limit_wh: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for m in ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez'] %}
              {%- set ns.l = ns.l + [states('input_number.fronius_limit_wh_' ~ m) | float(0)] -%}
            {%- endfor -%}
            {{ ns.l }}
          reserve_soc: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for m in ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez'] %}
              {%- set ns.l = ns.l + [states('input_number.fronius_reserve_soc_' ~ m) | float(0)] -%}
            {%- endfor -%}
            {{ ns.l }}

          start_soc: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for m in ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez'] %}
              {%- set ns.l = ns.l + [states('input_number.fronius_start_soc_' ~ m) | float(0)] -%}
            {%- endfor -%}
            {{ ns.l }}
automation:
  - id: fronius_saisonprofil_anwenden
    alias: "Fronius: Saisonprofil anwenden"
    mode: restart
    triggers:
      - trigger: time
        at: "00:00:05"
        id: monatsanfang
      - trigger: homeassistant
        event: start
        id: start
      - trigger: state
        entity_id: input_boolean.fronius_saisonprofil
        to: "on"
        id: aktiviert
      - trigger: state
        entity_id:
          - input_number.fronius_limit_wh_jan
          - input_number.fronius_limit_wh_feb
          - input_number.fronius_limit_wh_mar
          - input_number.fronius_limit_wh_apr
          - input_number.fronius_limit_wh_mai
          - input_number.fronius_limit_wh_jun
          - input_number.fronius_limit_wh_jul
          - input_number.fronius_limit_wh_aug
          - input_number.fronius_limit_wh_sep
          - input_number.fronius_limit_wh_okt
          - input_number.fronius_limit_wh_nov
          - input_number.fronius_limit_wh_dez
          - input_number.fronius_reserve_soc_jan
          - input_number.fronius_reserve_soc_feb
          - input_number.fronius_reserve_soc_mar
          - input_number.fronius_reserve_soc_apr
          - input_number.fronius_reserve_soc_mai
          - input_number.fronius_reserve_soc_jun
          - input_number.fronius_reserve_soc_jul
          - input_number.fronius_reserve_soc_aug
          - input_number.fronius_reserve_soc_sep
          - input_number.fronius_reserve_soc_okt
          - input_number.fronius_reserve_soc_nov
          - input_number.fronius_reserve_soc_dez
          - input_number.fronius_start_soc_jan
          - input_number.fronius_start_soc_feb
          - input_number.fronius_start_soc_mar
          - input_number.fronius_start_soc_apr
          - input_number.fronius_start_soc_mai
          - input_number.fronius_start_soc_jun
          - input_number.fronius_start_soc_jul
          - input_number.fronius_start_soc_aug
          - input_number.fronius_start_soc_sep
          - input_number.fronius_start_soc_okt
          - input_number.fronius_start_soc_nov
          - input_number.fronius_start_soc_dez
        id: geaendert
    variables:
      monate: ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dez']
      mon: "{{ monate[now().month - 1] }}"
      ent_limit: "{{ 'input_number.fronius_limit_wh_' ~ mon }}"
      ent_soc: "{{ 'input_number.fronius_reserve_soc_' ~ mon }}"
      ent_start: "{{ 'input_number.fronius_start_soc_' ~ mon }}"
    actions:
      # after a restart wait until the entities are restored
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'start' }}"
        then:
          - delay: "00:00:30"
      - condition: state
        entity_id: input_boolean.fronius_saisonprofil
        state: "on"
      # the time trigger only counts on the 1st of the month
      - condition: template
        value_template: "{{ trigger.id != 'monatsanfang' or now().day == 1 }}"
      # a changed value only counts if it belongs to the current month
      - condition: template
        value_template: "{{ trigger.id != 'geaendert' or trigger.entity_id.endswith('_' ~ mon) }}"
      # only with valid values
      - condition: template
        value_template: "{{ has_value(ent_limit) and has_value(ent_soc) and has_value(ent_start) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.fronius_bezug_limit_wh
        data:
          value: "{{ states(ent_limit) | float }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.fronius_reserve_soc
        data:
          value: "{{ states(ent_soc) | float }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.fronius_ziel_soc
        data:
          value: "{{ states(ent_soc) | float }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.fronius_start_soc
        data:
          value: "{{ states(ent_start) | float }}"
