# ============================================================
# OPTIONAL: seasonal profile (monthly values) for the Fronius peak shaving package
# OPTIONAL: Saisonprofil (Monatswerte) für das Fronius-Peakshaving-Package
# ------------------------------------------------------------
# For each month you set three values:
#   - max. grid import per 15 min (Wh)  -> input_number.fronius_bezug_limit_wh
#   - reserve SoC (%)                   -> input_number.fronius_reserve_soc
#                                          and the same value -> input_number.fronius_ziel_soc
#   - start SoC for grid charging (%)   -> input_number.fronius_start_soc
# The values of the current month are applied
#   - on the 1st of each month at 00:00:05,
#   - when Home Assistant starts (after 30 s),
#   - when you switch the profile on,
#   - when you change a value of the CURRENT month.
# The profile only writes the three target helpers while input_boolean.fronius_saisonprofil
# is on. Manual changes of the three helpers are overwritten at the next of these events.
#
# Needs packages/fronius_peakshaving.yaml (target helpers). No entity IDs to adjust.
# Fill in all 36 monthly values BEFORE you switch the profile on: the monthly helpers
# start at their minimum (100 Wh / 0 %) until you set them. They keep their values over restarts.
# Dashboard with chart and inputs: dashboard/fronius_saisonprofil_dashboard.yaml
# Note: grid charging starts below the lower of start SoC and target SoC, so keep the monthly
# start SoC at or below the monthly reserve/target SoC.
# ============================================================
input_boolean:
  fronius_saisonprofil:
    name: "Fronius: Saisonprofil aktiv"
    icon: mdi:calendar-sync

input_number:
  fronius_limit_wh_jan:
    name: "Fronius Profil Jan: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_feb:
    name: "Fronius Profil Feb: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_mar:
    name: "Fronius Profil Mär: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_apr:
    name: "Fronius Profil Apr: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_mai:
    name: "Fronius Profil Mai: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_jun:
    name: "Fronius Profil Jun: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_jul:
    name: "Fronius Profil Jul: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_aug:
    name: "Fronius Profil Aug: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_sep:
    name: "Fronius Profil Sep: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_okt:
    name: "Fronius Profil Okt: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_nov:
    name: "Fronius Profil Nov: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_limit_wh_dez:
    name: "Fronius Profil Dez: Max. Bezug pro 15 min"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: Wh
  fronius_reserve_soc_jan:
    name: "Fronius Profil Jan: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_feb:
    name: "Fronius Profil Feb: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_mar:
    name: "Fronius Profil Mär: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_apr:
    name: "Fronius Profil Apr: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_mai:
    name: "Fronius Profil Mai: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_jun:
    name: "Fronius Profil Jun: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_jul:
    name: "Fronius Profil Jul: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_aug:
    name: "Fronius Profil Aug: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_sep:
    name: "Fronius Profil Sep: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_okt:
    name: "Fronius Profil Okt: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_nov:
    name: "Fronius Profil Nov: Reserve-/Ziel-SoC"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_reserve_soc_dez:
