  fronius_start_soc_feb:
    name: "Fronius Profil Feb: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_mar:
    name: "Fronius Profil Mär: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_apr:
    name: "Fronius Profil Apr: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_mai:
    name: "Fronius Profil Mai: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_jun:
    name: "Fronius Profil Jun: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_jul:
    name: "Fronius Profil Jul: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_aug:
    name: "Fronius Profil Aug: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_sep:
    name: "Fronius Profil Sep: Start-SoC Netzladen"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fronius_start_soc_okt:
    name: "Fronius Profil Okt: Start-SoC Netzladen"
    min: 0
